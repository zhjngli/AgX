name: CI

on:
  pull_request:
    branches: [main]

# Minimum-privilege default. None of the CI jobs need write access — they
# only run cargo, build docs, and run tests. Add per-job overrides if a
# future job needs to comment on PRs / upload artifacts / etc.
permissions:
  contents: read

jobs:
  fast-checks-matrix:
    name: Fast (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - fmt
          - clippy
          - test-lib
          - test-cli
          - test-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fast-checks
      - name: Install libraw and libheif
        if: matrix.check != 'fmt'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev libheif-dev libheif-plugin-libde265
      - name: Run check
        run: ./scripts/verify.sh ${{ matrix.check }}

  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    if: always()
    needs: fast-checks-matrix
    steps:
      - run: |
          if [ "${{ needs.fast-checks-matrix.result }}" != "success" ]; then
            echo "Fast checks matrix failed: ${{ needs.fast-checks-matrix.result }}"
            exit 1
          fi

  docs-matrix:
    name: Docs (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - rustdoc
          - doc-links
          - book-linkcheck
          - wgsl-headers
          - markdown-lint
          - back-links
          - sibling-md-clean
          - book-no-internal-refs
          - doc-commands
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-checks
      - name: Install libraw and libheif
        if: matrix.check == 'rustdoc' || matrix.check == 'book-linkcheck' || matrix.check == 'doc-commands'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev libheif-dev libheif-plugin-libde265
      - name: Install mdbook and preprocessors
        if: matrix.check == 'book-linkcheck'
        run: |
          cargo install --locked mdbook --version 0.4.40
          cargo install --locked mdbook-linkcheck --version 0.7.7
          cargo install --locked mdbook-mermaid --version 0.14.0
          cargo install --locked mdbook-katex --version 0.9.0
      - name: Setup Node
        if: matrix.check == 'markdown-lint'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install markdownlint-cli2
        if: matrix.check == 'markdown-lint'
        run: npm install -g markdownlint-cli2@0.22.1
      - name: Run check
        run: ./scripts/verify.sh ${{ matrix.check }}

  docs-checks:
    name: Docs checks
    runs-on: ubuntu-latest
    if: always()
    needs: docs-matrix
    steps:
      - run: |
          if [ "${{ needs.docs-matrix.result }}" != "success" ]; then
            echo "Docs matrix failed: ${{ needs.docs-matrix.result }}"
            exit 1
          fi

  e2e-tests:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - cli_marina_sunset
          - cli_concert_hall
          - cli_mountain_valley
          - cli_sky_moon_wires
          - cli_cinque_terre_manarola
          - cli_grand_canyon_overlook
          - cli_cinque_terre_window
          - cli_geisel_library_bw
          - misc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libraw and libheif
        run: sudo apt-get update && sudo apt-get install -y libraw-dev libheif-dev libheif-plugin-libde265
      - name: Build CLI
        run: cargo build --release -p agx-cli
      - name: Run E2E tests
        run: |
          if [ "${{ matrix.suite }}" = "misc" ]; then
            cargo test -p agx-e2e --release -- "cli_corrupt|cli_nonexistent|cli_batch|library_" --test-threads=4
          else
            cargo test -p agx-e2e --release -- ${{ matrix.suite }} --test-threads=1
          fi

  gpu-profiling:
    name: GPU profiling (software Vulkan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa Vulkan (llvmpipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: GPU profile
        run: ./scripts/gpu-profile.sh

  e2e-rollup:
    name: E2E tests
    runs-on: ubuntu-latest
    if: always()
    needs: e2e-tests
    steps:
      - run: |
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "E2E matrix failed: ${{ needs.e2e-tests.result }}"
            exit 1
          fi
