[package]
name = "agx-photo"
version = "0.1.0"
edition = "2021"
description = "An open-source photo editing library with a readable, portable preset format"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhjngli/AgX"
homepage = "https://github.com/zhjngli/AgX"
documentation = "https://docs.rs/agx-photo"
readme = "../../README.md"
keywords = ["photo", "image", "editing", "preset", "lut"]
categories = ["multimedia::images", "command-line-utilities"]

[lib]
name = "agx"

[dependencies]
image = "0.25"
tiff = "0.10"
imageproc = "0.25"
palette = "0.7"
rayon = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
img-parts = "0.4"
little_exif = "0.6"
exif = { package = "kamadak-exif", version = "0.5" }
rand = "0.8"
jsonschema = { version = "0.30", default-features = false, optional = true }
serde_json = { version = "1", optional = true }
schemars = { version = "0.8", optional = true }
toml_edit = { version = "0.22", optional = true }
wgpu = { version = "24", optional = true }
naga_oil = { version = "0.16", optional = true }
naga = { version = "23", features = ["wgsl-in", "wgsl-out"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
half = { version = "2", features = ["bytemuck"], optional = true }
lcms2 = { version = "6", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[features]
default = ["gpu"]
raw = []
heic = []
profiling = ["dep:serde_json"]
docgen = ["dep:schemars", "dep:serde_json"]
validate = ["dep:schemars", "dep:serde_json", "dep:jsonschema", "dep:toml_edit"]
gpu = ["dep:wgpu", "dep:naga_oil", "dep:naga", "dep:bytemuck", "dep:pollster", "dep:half"]
icc = ["dep:lcms2"]

[package.metadata.docs.rs]
features = ["raw", "heic", "validate", "docgen", "icc"]
