[package]
name = "agx-e2e"
version = "0.1.0"
edition = "2021"
publish = false

# This is a test-only crate — it has no library consumers.
# src/lib.rs provides comparison utilities used by the integration tests.

# Dev-only crate — opt out of cargo-release's version bumps, replacements, and
# tag operations. `publish = false` only stops the upload, not the rest.
[package.metadata.release]
release = false

[dependencies]
image = "0.25"

[dev-dependencies]
agx = { package = "agx-photo", path = "../agx", features = ["raw", "heic", "icc"] }
exif = { package = "kamadak-exif", version = "0.5" }
tempfile = "3"
lcms2 = "6"
img-parts = "0.4"
